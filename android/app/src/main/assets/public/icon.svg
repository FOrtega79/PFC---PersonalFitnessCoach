<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C026D3" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle inner border ring -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3" />

  <!-- Background decorative glow -->
  <circle cx="256" cy="256" r="140" fill="url(#primaryGrad)" opacity="0.25" filter="url(#glow)" />

  <!-- Dynamic Athletic Icon: Stylized Lightning Bolt & Fitness Shield Motif -->
  <g transform="translate(256, 256) scale(1.15) translate(-128, -128)">
    <!-- Stylized Dumbbell / Energy Track Bars -->
    <path d="M 50 128 L 74 128" stroke="url(#accentGrad)" stroke-width="16" stroke-linecap="round" />
    <path d="M 44 98 L 44 158" stroke="url(#accentGrad)" stroke-width="14" stroke-linecap="round" />
    
    <path d="M 206 128 L 182 128" stroke="url(#accentGrad)" stroke-width="16" stroke-linecap="round" />
    <path d="M 212 98 L 212 158" stroke="url(#accentGrad)" stroke-width="14" stroke-linecap="round" />

    <!-- Central Lightning & Peak Energy Geometry -->
    <path d="M 148 36 L 90 140 L 126 140 L 108 220 L 176 116 L 140 116 Z" 
          fill="url(#primaryGrad)" 
          filter="url(#glow)" />
    
    <!-- Heartbeat / Activity Pulse Wave Underlay -->
    <path d="M 68 186 L 96 186 L 108 166 L 124 206 L 138 186 L 188 186" 
          fill="none" 
          stroke="url(#accentGrad)" 
          stroke-width="7" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          opacity="0.9" />
  </g>
</svg>
